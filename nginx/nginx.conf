# Load balancer in front of the API instances. Its presence is what makes the
# "stateless API" claim testable: requests land on different instances, and anything
# that depended on in-process state would break immediately (CLAUDE.md invariant 9).

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  upstream fintrack_api {
    # least_conn rather than round robin: analytics requests are not uniform in cost,
    # and a cache miss can take far longer than a hit. Round robin would keep handing
    # work to an instance already busy with a slow one.
    least_conn;

    # Docker's embedded DNS resolves this to every running api replica, so
    # `--scale api=N` needs no config change here.
    server api:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 8080;

    # The client's address, not the proxy's, reaches the app - which is why the API
    # sets `trust proxy`.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Generated here when absent so one request has one id across every log line,
    # Nginx's included.
    proxy_set_header X-Request-Id      $request_id;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # A read that outlives this is a bug worth surfacing, not worth waiting on.
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    location /health {
      # Kept out of the access log: the compose healthcheck polls it every few seconds
      # and would otherwise drown every real request.
      access_log off;
      proxy_pass http://fintrack_api;
    }

    location / {
      proxy_pass http://fintrack_api;
    }
  }
}
